stages:
  download:
    cmd: python -m src.data.download
    outs:
      - data/raw/telco_churn.csv

  validate:
    cmd: python -m src.data.validate
    deps:
      - data/raw/telco_churn.csv
      - src/data/validate.py
      - src/data/schemas.py
    metrics:
      - reports/validation.json:
          cache: false

  preprocess:
    cmd: python -m src.features.preprocess
    deps:
      - data/raw/telco_churn.csv
      - reports/validation.json
      - src/features/preprocess.py
      - src/data/schemas.py
    params:
      - data.test_size
      - data.random_state
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
    metrics:
      - reports/preprocess.json:
          cache: false

  train:
    cmd: python -m src.models.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/features/preprocess.py
      - src/models/train.py
    params:
      - data.random_state
      - train
    outs:
      - models/model.joblib
      - reports/feature_importance.csv:
          cache: false
    metrics:
      - reports/train_metrics.json:
          cache: false
